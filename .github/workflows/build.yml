name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and verify main.dol
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire pinned tools
        run: python tools/setup/acquire_tools.py

      - name: Install ninja
        run: |
          python -m venv .venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --disable-pip-version-check ninja==1.13.0

      - name: Configure
        run: python configure.py

      - name: Build
        run: .venv/Scripts/ninja

      - name: Verify
        run: python tools/verify/verify.py verify --manifest config/targets/wpse-v1.json --reference-dir orig/wpse-v1 --build-dir build/wpse-v1 --report build/wpse-v1/verification.json

      - name: Check for build rewrites of tracked files
        if: always()
        run: |
          $changed = git status --porcelain --untracked-files=no
          if ($changed) {
            $changed | ForEach-Object { Write-Output "::warning::The build rewrote a tracked file: $_" }
            git diff --stat
          }

      - name: Render progress images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/progress/progress.py render --phases config/progress.json --report build/wpse-v1/report.json --output-dir build/progress-images
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($image in Get-ChildItem build/progress-images -Filter *.svg) {
            $committed = Join-Path docs/images $image.Name
            if (-not (Test-Path $committed) -or (Get-FileHash $committed).Hash -ne (Get-FileHash $image.FullName).Hash) {
              Write-Output "::warning::docs/images/$($image.Name) is stale; download the progress-images artifact and commit it."
            }
          }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/wpse-v1/report.json
            build/wpse-v1/verification.json
          if-no-files-found: warn

      - name: Upload progress images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: progress-images
          path: build/progress-images/*.svg
